loopback_users.guest = false
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip  = 0.0.0.0

# Absolute limits sized for a 512MB Starter: the broker sees the host's RAM,
# not the container's cap, so a relative watermark would never fire.
# The alarm only blocks publishers; consumer connections, unacked deliveries
# and Erlang overhead keep growing past it, so leave ~half the container as
# headroom. Measure RSS, which is what the container limit counts.
vm_memory_high_watermark.absolute = 256MB
vm_memory_calculation_strategy = rss
disk_free_limit.absolute = 1GB

# The management stats database is one of the largest memory users.
# We only read queue depths, so skip message-rate history and sample less often.
management.rates_mode = none
collect_statistics_interval = 30000

# Celery's remote-control reply queues (*.reply.celery.pidbox) and event queues
# are non-durable, non-exclusive queues, which 4.3 rejects by default.
deprecated_features.permit.transient_nonexcl_queues = true
