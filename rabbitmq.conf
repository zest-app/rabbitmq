loopback_users.guest = false
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip  = 0.0.0.0

# Absolute resource limits: 3.8.0 can't read the container's cgroup memory cap,
# so it defaults to a % of the host node's RAM and never throttles before the
# container OOM-kills. Pin absolutes sized for a 512MB Starter instead.
# Broker applies publisher backpressure at these thresholds rather than crashing.
#
# The alarm only blocks publishers; consumer connections, unacked deliveries and
# Erlang overhead keep growing past it, so leave ~half the container as headroom.
# Measure RSS (what the container limit counts) rather than allocator totals.
vm_memory_high_watermark.absolute = 256MB
vm_memory_calculation_strategy = rss
disk_free_limit.absolute = 1GB

# The management stats database is one of the largest memory users on 3.8.
# We only read queue depths, so skip message-rate history and sample less often.
management.rates_mode = none
collect_statistics_interval = 30000
