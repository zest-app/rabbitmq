loopback_users.guest = false
listeners.tcp.default = 5672
management.tcp.port = 15672
management.tcp.ip  = 0.0.0.0

# Absolute resource limits: 3.8.0 can't read the container's cgroup memory cap,
# so it defaults to a % of the host node's RAM and never throttles before the
# container OOM-kills. Pin absolutes sized for a 512MB Starter instead.
# Broker applies publisher backpressure at these thresholds rather than crashing.
vm_memory_high_watermark.absolute = 300MB
disk_free_limit.absolute = 1GB
